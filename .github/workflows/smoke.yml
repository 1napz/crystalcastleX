name: Smoke Tests

on:
  pull_request:
    paths:
      - "app/"
      - "tests/"
      - "docker-compose.yml"
      - "Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/smoke.yml"
  push:
    branches:
      - main
    paths:
      - "app/"
      - "tests/"
      - "docker-compose.yml"
      - "Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/smoke.yml"

jobs:
  smoke:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Built-in cache available in v5+

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images with Bake & GHA cache
        uses: docker/bake-action@v6
        with:
          load: true
          files: docker-compose.yml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Start services
        run: docker compose up -d

      - name: Wait for API readiness
        run: |
          set -e
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/v1/status; then
              echo "✅ API is healthy"
              exit 0
            fi
            echo "⏳ Waiting for API... ($i/15)"
            sleep 1
          done
          echo "❌ API failed health check"
          docker compose logs
          exit 1

      - name: Execute smoke tests
        env:
          API_BASE: http://localhost:8000
          X_API_KEY: local-dev-key
        run: pytest -q -x tests/test_smoke_generation.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up resources
        if: always()
        run: docker compose down -v
