name: 🚀 Production Deploy & Automation Test
on:
  push:
    branches: [main]
    # Path Filtering: รันเฉพาะเมื่อไฟล์ระบบเปลี่ยน ห้ามรันเมื่อแก้ไฟล์ .md หรือเอกสาร docs
    paths-ignore:
      - '**.md'
      - 'main/docs/**'
      - '.github/CODEOWNERS'
  # Schedule-Driven: สั่งรันเช็คระบบอัตโนมัติทุกวัน ตอนเที่ยงคืน (UTC+7)
  schedule:
    - cron: '0 17 * * *' # 17:00 UTC = 00:00 น. ประเทศไทย
  # Manual Run: เปิดให้กดสั่งรันเองได้จากหน้า Actions
  workflow_dispatch:

permissions:
  contents: read

# Concurrency: ยกเลิกตัวเก่าที่กำลังรันค้าง แล้วรันแค่ตัวล่าสุด ประหยัดทรัพยากร
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-validation:
    name: 🧪 Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache dependencies → รอบถัดไปเร็วขึ้น

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-playwright
          # pip install -r requirements.txt # เปิดใช้เมื่อมีไฟล์นี้พร้อมแล้ว

      - name: 🌐 Install Playwright & Browsers
        run: playwright install chromium --with-deps

      - name: 📁 Prepare Output Directories
        run: mkdir -p failure-screenshots test-results

      - name: 🧪 Execute Headless Testing
        env:
          AFFILIATE_SECRET_KEY: ${{ secrets.AFFILIATE_SECRET_KEY }}
        run: |
          # --headless ไม่ใช้ — Playwright รันแบบไม่แสดงหน้าต่างโดยค่าเริ่มต้น
          # ใช้ --headed หากต้องการเห็นหน้าต่างเบราว์เซอร์ตอนรัน
          pytest \
            --tb=short \
            --screenshot=only-on-failure \
            --output-dir=test-results/

      - name: 📸 Save Evidence on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playables-error-evidence
          path: |
            failure-screenshots/
            test-results/
          retention-days: 7

  vercel-deployment:
    name: ☁️ Deploy to Vercel
    needs: environment-validation # รอให้ผ่านการทดสอบก่อนค่อย Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20 # ยังคงใช้ 20 ตามเดิม; GitHub จะอัปเกรดเป็น 24 ให้อัตโนมัติ

      - name: ⚡ Build & Deploy to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npm ci
          npm run build
          npx vercel --prod --yes
