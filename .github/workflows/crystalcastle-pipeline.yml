name: 🧊 CrystalCastle CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    name: 📝 Lint Documentation
    runs-on: ubuntu-24.04 # Pin stable, avoid Ubuntu 26 auto-switch

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ✅ Check docs folder exists
        id: check-docs
        run: |
          if [ -d docs ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ docs/ folder not found — skipping markdown lint"
          fi

      - name: 🧹 Run Markdown Lint
        if: steps.check-docs.outputs.exists == 'true'
        run: |
          npx markdownlint-cli@latest "docs/**/*.md" --config .markdownlint.json
        continue-on-error: false

  policy-check:
    name: 📋 Commit Policy
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10 # Need recent commits for validation

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: ✅ Check policy script exists
        id: check-script
        run: |
          if [ -f scripts/check_commit_policy.py ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ scripts/check_commit_policy.py not found — skipping check"
          fi

      - name: 🔍 Validate Commit Policy
        if: steps.check-script.outputs.exists == 'true'
        run: |
          python scripts/check_commit_policy.py
        continue-on-error: false

  test:
    name: 🧪 Python Tests
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: ✅ Verify requirements.txt exists
        id: check-req
        run: |
          if [ -f requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ requirements.txt not found — skipping test job"
          fi

      - name: 📦 Install Dependencies
        if: steps.check-req.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Pytest
        if: steps.check-req.outputs.exists == 'true'
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "ℹ️ tests/ folder not found — creating empty placeholder"
            mkdir -p tests && touch tests/.gitkeep
          fi

  build:
    name: 🏗️ Build Docs
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material
          pip install -r requirements.txt 2>/dev/null || true

      - name: ✅ Verify mkdocs.yml exists
        id: check-mkdocs
        run: |
          if [ -f mkdocs.yml ] || [ -f mkdocs.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ mkdocs config not found — skipping docs build"
          fi

      - name: 🏗️ Build Documentation
        if: steps.check-mkdocs.outputs.exists == 'true'
        run: mkdocs build --strict

  deploy:
    name: ☁️ Deploy → Vercel
    needs: [lint, policy-check, test, build]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ⚡ Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest \
            --token="$VERCEL_TOKEN" \
            --prod \
            --yes
