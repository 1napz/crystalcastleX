name: 🏗️ Restructure Project Folders

on:
  push:
    branches:
      - main

jobs:
  restructure:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write # Required to push changes

    steps:
      - name: 📥 Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📂 Create target directories
        run: |
          mkdir -p frontend backend development

      - name: 🚚 Move frontend assets
        run: |
          files=(
            "index.html"
            "product.html"
            "artifacts.html"
            "style.css"
            "product.js"
          )
          for f in "${files[@]}"; do
            if [ -e "$f" ]; then
              echo "Moving frontend/$f"
              mv "$f" frontend/
            else
              echo "⚠️ Not found: $f — skipping"
            fi
          done

      - name: 🚚 Move backend modules
        run: |
          dirs=(
            "api"
            "lib"
            "services"
            "models"
            "tests"
          )
          for d in "${dirs[@]}"; do
            if [ -d "$d" ]; then
              echo "Moving backend/$d"
              mv "$d" backend/
            else
              echo "⚠️ Not found: $d/ — skipping"
            fi
          done

      - name: 📋 Move development docs
        run: |
          items=(
            "docs"
            "roadmap.md"
            "governance.md"
          )
          for item in "${items[@]}"; do
            if [ -e "$item" ]; then
              echo "Moving development/$item"
              mv "$item" development/
            else
              echo "⚠️ Not found: $item — skipping"
            fi
          done

      - name: ✍️ Commit & push reorganization
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "✅ No changes to commit — structure already matches"
            exit 0
          fi
          
          git commit -m "chore: reorganize → frontend/backend/development"
          git push origin main
          echo "🚀 Restructure changes pushed successfully"
