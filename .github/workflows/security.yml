# .github/workflows/security.yml
name: Security and Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  trufflehog-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  security-check:
  runs-on: ubuntu-24.04
  steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Scan for secrets (gitleaks)
      uses: gitleaks/gitleaks-action@v2
      with:
        config-path: .gitleaks.toml

    - name: Quick pattern check
      run: |
        if grep -RiE "(api_key|api-key|secret|token|password|private_key)" . --include="*.env" --include="*.yml" --include="*.yaml" --include="*.json"; then
          echo "⚠️ พบรูปแบบที่น่าสงสัย"
          exit 1
        fi


  repo-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          CHANGELOG_VERSION=$(grep -m1 '^## ' changelog.md | sed 's/## //')
          if [ "$VERSION" != "$CHANGELOG_VERSION" ]; then exit 1; fi
