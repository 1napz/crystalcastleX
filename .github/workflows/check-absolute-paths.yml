name: 🔍 Check Absolute Paths

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Daily check at 09:00 UTC = 16:00 ICT

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    name: 🔍 Scan & Report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt
          [ -f requirements.txt ] && pip install -r requirements.txt

      - name: 🧪 Run Tests
        run: |
          if [ -d tests ]; then
            python -m pytest -q --tb=short
          else
            echo "ℹ️ No tests directory found — skipping"
          fi

      - name: 🔍 Scan Paths
        id: scanner
        run: |
          python scripts/scan_paths.py --format md > path_report.md
          python scripts/scan_paths.py --format json > path_report.json
          echo "completed=true" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: 📤 Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: path-scan-reports
          retention-days: 7
          path: |
            path_report.md
            path_report.json

      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: path_report.md
          comment-author: 'github-actions[bot]'
          edit-mode: replace # Update same comment instead of spamming

      - name: 🔎 Check CODEOWNERS
        id: check_codeowners
        run: |
          if [ -f CODEOWNERS ] || [ -f .github/CODEOWNERS ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "✅ CODEOWNERS file exists"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No CODEOWNERS file found"
          fi

      - name: 📋 Create CODEOWNERS Branch
        if: >-
          steps.check_codeowners.outputs.found == 'false' &&
          github.event_name != 'schedule' &&
          !startsWith(github.head_ref, 'automation/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="automation/add-codeowners-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mkdir -p .github

          cat > .github/CODEOWNERS <<'EOF'
# Auto-generated CODEOWNERS template
# Review and update with your actual team members
# See: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners

# Root defaults
* @zyntromedia

# Specific paths
# /scripts/    @team-backend
# /docs/       @team-docs
# /tests/      @team-qa
# /.github/    @zyntromedia

          git add .github/CODEOWNERS
          git commit -m "chore: add CODEOWNERS template [automated]"
          git push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        id: create_branch

      - name: 🚀 Create CODEOWNERS PR
        if: >-
          steps.check_codeowners.outputs.found == 'false' &&
          github.event_name != 'schedule' &&
          !startsWith(github.head_ref, 'automation/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.create_branch.outputs.branch }}"
          gh pr create \
            --title "chore: add CODEOWNERS template [automated]" \
            --body "Auto-generated CODEOWNERS template.

**Next steps:**
- Review the file and replace placeholder teams with actual owners
- Add specific path entries as needed
- Merge once reviewed" \
            --base "${{ github.repository.default_branch }}" \
            --head "$BRANCH" \
            --label "automation" \
            --label "needs-review"

      - name: 🏷️ Add Labels
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['automation', 'path-scan'];
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels
            });
