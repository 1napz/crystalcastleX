name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
      - dev
      - agent

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

  apply-label:
    name: Apply License Label
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always() && github.event_name == 'pull_request'
    env:
      LABEL: ${{ needs.build-and-test.result == 'success' && 'license-compliant' || 'license-violation' }}
    steps:
      - name: Apply PR label
        uses: actions/github-script@v7
        with:
          script: |
            if (!context.issue.number) {
              console.log('Not a pull request event - skipping label.');
              return;
            }

            const newLabel = process.env.LABEL || 'license-compliant';
            const opposite = newLabel === 'license-compliant' ? 'license-violation' : 'license-compliant';

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: opposite
              });
              console.log("Removed label: " + opposite);
            } catch (e) {
              console.log("No '" + opposite + "' label found to remove.");
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [newLabel]
            });
            console.log("Added label: " + newLabel);
