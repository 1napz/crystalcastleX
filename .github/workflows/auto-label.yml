name: 🔖 Auto Labeler

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest

    steps:
      - name: Apply labels from title
        uses: actions/github-script@v7
        with:
          script: |
            const item = context.payload.pull_request || context.payload.issue;
            if (!item) return;

            const title = item.title.toLowerCase();
            const labels = new Set();

            // -------------------------
            // 🧩 TYPE
            // -------------------------
            if (title.match(/\bfix\b|\bbug\b/)) labels.add("type:bug");
            if (title.match(/\bfeat\b|\bfeature\b/)) labels.add("type:feature");
            if (title.match(/\bchore\b|\bcleanup\b/)) labels.add("type:chore");
            if (title.match(/\brefactor\b/)) labels.add("type:refactor");

            // -------------------------
            // ⚙️ AREA
            // -------------------------
            
            if (title.match(/\bai\b|\bmodel\b|\bllm\b|\brag\b|\bprompt\b/))labels.add("area:ai");
            if (title.match(/\bfrontend\b|\breact\b|\bvite\b|\bui\b|\bux\b|\bcomponent\b|\bpage\b/))labels.add("area:frontend");
            if (title.match(/\bbackend\b|\bfastapi\b|\bserver\b|\bservice\b/))labels.add("area:backend");
            if (title.match(/\bapi\b|\bendpoint\b|\brest\b/))labels.add("area:api");
            if (title.match(/\bdb\b|\bdatabase\b|\bpostgres\b|\bsql\b/))labels.add("area:database");
            if (title.match(/\bauth\b|\blogin\b|\bjwt\b|\boauth\b/))labels.add("area:auth");
            if (title.match(/\bpayment\b|\bstripe\b|\bbilling\b/))labels.add("area:payments");
            if (title.match(/\bstorage\b|\bs3\b|\bupload\b|\bfile\b/))labels.add("area:storage");
            if (title.match(/\bsupabase\b/))labels.add("area:supabase");
            if (title.match(/\bgraphql\b/))labels.add("area:graphql");
            if (title.match(/\bk8s\b|\bkubernetes\b|\bhelm\b/))labels.add("area:kubernetes");
            if (title.match(/\bdocker\b|\bcontainer\b/))labels.add("area:docker");
            if (title.match(/\bmonitoring\b|\bprometheus\b|\bgrafana\b/))labels.add("area:monitoring");
            if (title.match(/\banalytics\b|\btracking\b|\btelemetry\b/))labels.add("area:analytics");
            if (title.match(/\bui\b|\bux\b|\bdesign\b|\bfigma\b/))labels.add("area:ui-ux");
            if (title.match(/\bvideo\b|\brender\b/))labels.add("area:video");
            if (title.match(/\bci\b|\bworkflow\b|\bgithub actions?\b/))labels.add("area:ci");
            if (title.match(/\binfra\b|\bdeploy\b|\bterraform\b/))labels.add("area:infra");

            // -------------------------
            // 📚 DOC
            // -------------------------
            if (title.match(/\bdocs?\b|\breadme\b|\bchecklist\b/)) labels.add("documentation");

            // -------------------------
            // 🔐 SECURITY
            // -------------------------
            if (title.match(/\bsecurity\b|\bvulnerability\b/)) labels.add("security");

            // -------------------------
            // 🏷️ ENSURE LABELS EXIST
            // -------------------------
            const labelDefs = {
              "type:bug":       { color: "d73a4a", description: "Something isn't working" },
              "type:feature":   { color: "0075ca", description: "New feature or request" },
              "type:chore":     { color: "e4e669", description: "Maintenance task" },
              "type:refactor":  { color: "f9d0c4", description: "Code refactoring" },
              "area:ai":        { color: "7057ff", description: "AI / LLM related" },
              "area:video":     { color: "008672", description: "Video generation" },
              "area:ci":        { color: "0052cc", description: "CI/CD workflows" },
              "area:infra":     { color: "e4e669", description: "Infrastructure / Supabase" },
              "documentation":  { color: "0075ca", description: "Improvements or additions to docs" },
              "security":       { color: "d73a4a", description: "Security related" },
              "area:frontend":  { color: "1d76db", description: "Frontend application"},
              "area:backend":   { color: "5319e7", description: "Backend services"},
              "area:api":       { color: "0e8a16", description: "API related"},
              "area:database":  { color: "006b75", description: "Database related"},
              "area:auth":      { color: "d876e3", description: "Authentication and authorization"},
              "area:payments":  { color: "fbca04", description: "Payments and billing"},
              "area:storage":   { color: "bfdadc", description: "File and object storage"},
              "area:supabase":  { color: "3ecf8e", description: "Supabase related"},
              "area:graphql":   { color: "e10098", description: "GraphQL related"},
              "area:kubernetes":{ color: "326ce5", description: "Kubernetes related"},
              "area:docker": {color: "2496ed", description: "Docker related"},
              "area:monitoring": { color: "f97316",description: "Monitoring and observability"},
              "area:analytics": {  color: "7c3aed",  description: "Analytics and telemetry"},
              "area:ui-ux": {  color: "ec4899",  description: "UI and UX design"},
            };

            const existingLabels = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const existingNames = existingLabels.data.map(l => l.name);

            for (const [name, meta] of Object.entries(labelDefs)) {
              if (!existingNames.includes(name)) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: meta.color,
                    description: meta.description
                  });
                } catch (e) {
                  core.warning(`Could not create label: ${name}`);
                }
              }
            }

            // -------------------------
            // 🧹 CLEAN OLD LABELS
            // -------------------------
            const oldLabels = ["bug", "enhancement", "ci/cd", "video"];
            try {
              const current = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number
              });
              for (const l of current.data) {
                if (oldLabels.includes(l.name)) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: item.number,
                    name: l.name
                  });
                }
              }
            } catch (e) {
              core.warning("Failed to clean old labels");
            }

            // -------------------------
            // 🚀 APPLY LABELS
            // -------------------------
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                issue_number: item.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: Array.from(labels)
              });
            }
