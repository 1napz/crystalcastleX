name: Monorepo CI/CD with Vercel Remote Cache

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  ci:
    name: Build & Test / ${{ matrix.app }}
    runs-on: ubuntu-24.04  # Pin stable; avoid auto-migration surprises
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, docs, admin]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Turbo needs HEAD^ for change detection

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # === FIX: Disable built-in cache until lockfile exists ===
          cache: ''  # Explicitly empty → no lockfile dependency

      - name: 📦 Generate Lockfile & Install Dependencies
        run: |
          # npm ci requires lockfile → use npm install until committed
          npm install
          # Optional: commit/push package-lock.json afterward
          echo "✅ Dependencies installed"

      - name: 🔍 Lint
        run: npx turbo run lint --filter=apps/${{ matrix.app }}

      - name: 🏗️ Build
        run: npx turbo run build --filter=apps/${{ matrix.app }}

      - name: 🧪 Test
        run: npx turbo run test --filter=apps/${{ matrix.app }}

  deploy:
    name: ☁️ Deploy → Vercel Production
    needs: ci
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ''

      - name: 🚀 Deploy to Vercel
        run: |
          npm install
          npx vercel \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --prod \
            --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
