name: 🛡️ CodeQL Analysis
run-name: "Code Scanning"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 1 * * 0'  # รันอัตโนมัติทุกวันอาทิตย์ เวลา 08:30 (เวลาประเทศไทย)

permissions:
  contents: read
  security-events: write   # ✅ จำเป็นอย่างยิ่ง — ถ้าขาดส่งผลไม่ได้
  actions: read

jobs:
  analyze:
    name: วิเคราะห์โค้ด
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']

    steps:
      - name: 📥 ดึงโค้ด
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 เริ่มต้น CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: 📦 ติดตั้ง Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 ติดตั้ง Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 ติดตั้งแพ็กเกจ / Build
        run: |
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "package.json" ]; then npm ci; fi

      - name: 🔍 ทำการสแกน
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
